{% extends "base.html" %}

{% block content %}
<h2>Add New Patient</h2>
<form method="POST">
    <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" required>
    </div>
    <div class="form-group">
    <label>Phone Number (for WhatsApp)</label>
    <input type="tel" name="phone" placeholder="+27791234567 or +243123456789" >
    <small style="color: #666; display: block; margin-top: 5px;">
        Include country code: 
        🇿🇦 South Africa: +27 79 123 4567<br>
        🇨🇩 DRC: +243 123 456 789<br>
        🇿🇼 Zimbabwe: +263 77 123 4567
    </small>
</div>
    <div class="form-group">
        <label>Email (optional)</label>
        <input type="email" name="email">
    </div>
    <div class="form-group">
    <label>Reminder Type</label>
    <select name="reminder_type" required style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px;">
        <option value="both">Both (6-month cleaning & 3-month checkup)</option>
        <option value="cleaning">Only 6-month Cleaning</option>
        <option value="checkup">Only 3-month Checkup</option>
    </select>
    <small style="color: #666;">Choose which reminders this patient should receive</small>
	</div>
    <div class="form-group">
        <label>Last Cleaning Date</label>
        <input type="date" name="last_cleaning">
    </div>
    <div class="form-group">
        <label>Last Checkup Date</label>
        <input type="date" name="last_checkup">
    </div>
    <div class="form-group">
        <label>Notes (allergies, preferences, etc.)</label>
        <textarea name="notes" rows="3"></textarea>
    </div>
    <button type="submit" class="btn">Add Patient</button>
</form>

<style>
    select {
        width: 100%;
        padding: 10px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
    }
    small {
        display: block;
        margin-top: 5px;
        font-size: 12px;
    }
</style>
{% endblock %}
