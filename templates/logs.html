{% extends "base.html" %}

{% block content %}
<h2>Reminder History</h2>
<table>
    <thead>
        <tr><th>Date</th><th>Patient</th><th>Reminder Type</th><th>Method</th><th>Status</th></tr>
    </thead>
    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.sent_at }}</td>
            <td>{{ log.patient_name }}</td>
            <td>{{ log.reminder_type }}</td>
            <td>{{ log.method }}</td>
            <td>{{ log.status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
